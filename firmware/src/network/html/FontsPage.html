<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnePage Reader - Fonts</title>
    <style>
      :root {
        --paper: #f6f1e7;
        --paper-2: #ece2ce;
        --card: #fffdf8;
        --ink: #2a2018;
        --ink-soft: #6f6253;
        --ink-faint: #a4967f;
        --line: #e3d9c6;
        --seal: #a63a24;
        --seal-soft: #c05a41;
        --shadow: rgba(60, 42, 20, 0.12);
        --danger: #b23b2e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #17140f;
          --paper-2: #211b13;
          --card: #211c15;
          --ink: #ece4d4;
          --ink-soft: #b3a78f;
          --ink-faint: #7d715d;
          --line: #332c21;
          --seal: #d9614a;
          --seal-soft: #e88268;
          --shadow: rgba(0, 0, 0, 0.4);
          --danger: #e0685a;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body {
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
          "Songti SC", "STSong", serif;
        max-width: 760px;
        margin: 0 auto;
        padding: 40px 24px 60px;
        background: radial-gradient(1100px 520px at 100% -12%, var(--paper-2), transparent 62%), var(--paper);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      .masthead { display: flex; align-items: center; gap: 14px; padding-bottom: 14px; border-bottom: 3px double var(--line); }
      .seal-mark { flex: none; width: 42px; height: 42px; border-radius: 8px; background: var(--seal); color: #fff8f0; display: grid; place-items: center; font-size: 1.15rem; box-shadow: 0 4px 14px -6px var(--seal); }
      .masthead h1 { margin: 0; font-size: 1.7rem; font-weight: 600; line-height: 1.05; }
      .masthead .sub { margin: 2px 0 0; font-size: 0.82rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); }
      h1 { display: none; }
      h2 { margin: 0 0 6px; font-size: 1.15rem; font-weight: 600; color: var(--ink); }
      h2 .rule { display: inline-block; width: 26px; height: 2px; background: var(--seal); vertical-align: middle; margin-right: 10px; }
      h3 { margin: 0 0 4px 0; font-size: 1.05rem; font-weight: 600; }
      .nav-links { margin: 26px 0 30px; display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
      .nav-links a { position: relative; padding: 11px 18px; color: var(--ink-soft); text-decoration: none; font-size: 0.96rem; transition: color 0.2s; }
      .nav-links a::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: -1px; height: 2px; background: var(--seal); transform: scaleX(0); transform-origin: left; transition: transform 0.28s ease; }
      .nav-links a:hover { color: var(--ink); }
      .nav-links a:hover::after { transform: scaleX(1); }
      .nav-links a.active { color: var(--seal); font-weight: 600; }
      .nav-links a.active::after { transform: scaleX(1); }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 22px 24px;
        margin: 16px 0;
        box-shadow: 0 1px 0 var(--shadow), 0 16px 38px -26px var(--shadow);
        animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .card:nth-of-type(3) { animation-delay: 0.07s; }
      .card:nth-of-type(4) { animation-delay: 0.14s; }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      .family {
        border-bottom: 1px dashed var(--line);
        padding: 14px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .family:last-child { border-bottom: none; }
      .family-info { flex: 1; }
      .family-meta { color: var(--ink-faint); font-size: 0.86rem; font-family: "Optima", "Candara", system-ui, sans-serif; }
      .btn {
        padding: 7px 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.88rem;
        font-family: "Optima", "Candara", system-ui, sans-serif;
        transition: transform 0.12s, background 0.2s, box-shadow 0.2s;
      }
      .btn:active { transform: translateY(1px); }
      .btn-danger { background: transparent; color: var(--danger); border: 1px solid currentColor; }
      .btn-danger:hover { background: var(--danger); color: #fff; box-shadow: 0 6px 16px -8px var(--danger); }
      .btn-primary { background: var(--seal); color: #fff8f0; box-shadow: 0 6px 16px -8px var(--seal); }
      .btn-primary:hover { background: var(--seal-soft); }
      .upload-form { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      .upload-form input[type="file"] {
        flex: 1;
        min-width: 220px;
        font-family: "Optima", "Candara", system-ui, sans-serif;
        font-size: 0.88rem;
        color: var(--ink-soft);
      }
      #status {
        margin-top: 14px;
        padding: 10px 14px;
        border-radius: 8px;
        display: none;
        font-family: "Optima", "Candara", system-ui, sans-serif;
        font-size: 0.9rem;
      }
      .status-ok { background: rgba(52, 120, 74, 0.14); color: #357a44; border: 1px solid rgba(52, 120, 74, 0.3); display: block !important; }
      .status-err { background: rgba(178, 59, 46, 0.12); color: var(--danger); border: 1px solid rgba(178, 59, 46, 0.3); display: block !important; }
      .empty { color: var(--ink-faint); text-align: center; padding: 24px; font-style: italic; }
    </style>
  </head>
  <body>
    <div class="masthead">
      <div class="seal-mark">壹</div>
      <div>
        <h1 style="display:block">OnePage Reader</h1>
        <p class="sub">Font Library</p>
      </div>
    </div>

    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/files">File Manager</a>
      <a href="/settings">Settings</a>
      <a href="/fonts" class="active">Fonts</a>
      <a href="/txt-index">TXT Index</a>
    </div>

    <div class="card">
      <h2><span class="rule"></span>Installed Fonts</h2>
      <div id="families"><p class="empty">Loading...</p></div>
    </div>

    <div class="card">
      <h2><span class="rule"></span>Upload Font</h2>
      <form class="upload-form" id="uploadForm">
        <input type="file" id="fontFiles" webkitdirectory directory multiple required />
        <button type="submit" class="btn btn-primary">Upload</button>
      </form>
      <p id="pickedInfo" class="family-meta" style="margin: 8px 0 0;"></p>
      <div id="status"></div>
    </div>

  <script>
    function formatSize(bytes) {
      if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
      if (bytes >= 1024) return (bytes / 1024).toFixed(0) + ' KB';
      return bytes + ' B';
    }

    async function loadFonts() {
      const el = document.getElementById('families');
      try {
        const res = await fetch('/api/fonts');
        const data = await res.json();
        // Build rows with DOM APIs and textContent so on-device family names
        // (which can contain arbitrary characters) cannot break markup or
        // execute script via innerHTML / inline onclick interpolation.
        el.replaceChildren();
        if (!data.families || data.families.length === 0) {
          const p = document.createElement('p');
          p.className = 'empty';
          p.textContent = 'No fonts installed';
          el.appendChild(p);
          return;
        }
        for (const f of data.families) {
          const row = document.createElement('div');
          row.className = 'family';

          const info = document.createElement('div');
          info.className = 'family-info';
          const h3 = document.createElement('h3');
          h3.textContent = f.name;
          info.appendChild(h3);
          const meta = document.createElement('span');
          meta.className = 'family-meta';
          const sizes = (f.sizes || []).join(', ');
          const filesSizes = (f.files || []).map(fi => formatSize(fi.size)).join(' + ');
          meta.textContent = sizes + 'pt · ' + filesSizes;
          info.appendChild(meta);

          const btn = document.createElement('button');
          btn.className = 'btn btn-danger';
          btn.textContent = 'Delete';
          // Capture name in the closure rather than interpolating into onclick.
          const familyName = f.name;
          btn.addEventListener('click', () => deleteFamily(familyName));

          row.appendChild(info);
          row.appendChild(btn);
          el.appendChild(row);
        }
      } catch (e) {
        el.replaceChildren();
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = 'Failed to load font list';
        el.appendChild(p);
      }
    }

    async function deleteFamily(name) {
      if (!confirm('Delete font family "' + name + '"?')) return;
      const status = document.getElementById('status');
      status.className = '';
      status.style.display = 'block';
      status.textContent = 'Deleting ' + name + '...';
      try {
        const res = await fetch('/api/fonts/delete', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({family: name})
        });
        if (res.ok) {
          status.className = 'status-ok';
          status.textContent = 'Deleted "' + name + '".';
        } else {
          status.className = 'status-err';
          status.textContent = 'Failed to delete "' + name + '".';
        }
      } catch (err) {
        status.className = 'status-err';
        status.textContent = 'Delete error: ' + err.message;
      }
      await loadFonts();
    }

    // Derive family name from a .cpfont filename: take everything before the
    // last '-' or '_' (that separator precedes the size suffix, e.g. Bookerly_12.cpfont).
    function familyFromFilename(name) {
      const stem = name.replace(/\.cpfont$/i, '');
      const cut = Math.max(stem.lastIndexOf('-'), stem.lastIndexOf('_'));
      return cut > 0 ? stem.slice(0, cut) : stem;
    }

    // Sanitize to match firmware's [A-Za-z0-9_-]+ pattern.
    function sanitizeFamily(raw) {
      return raw.replace(/[^A-Za-z0-9_-]/g, '_');
    }

    function cpfontFilesOnly(fileList) {
      return Array.from(fileList).filter(f => /\.cpfont$/i.test(f.name));
    }

    document.getElementById('fontFiles').addEventListener('change', function() {
      const info = document.getElementById('pickedInfo');
      const files = cpfontFilesOnly(this.files);
      if (files.length === 0) {
        info.textContent = 'No .cpfont files found in the selected folder.';
        return;
      }
      const family = sanitizeFamily(familyFromFilename(files[0].name));
      info.textContent = files.length + ' file' + (files.length === 1 ? '' : 's') +
        ' → family "' + family + '"';
    });

    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const status = document.getElementById('status');
      const files = cpfontFilesOnly(document.getElementById('fontFiles').files);
      if (files.length === 0) {
        status.className = 'status-err';
        status.style.display = 'block';
        status.textContent = 'No .cpfont files selected.';
        return;
      }

      // A directory picker may include files from multiple family subfolders.
      // Reject that up front — otherwise files[0]'s family is silently reused
      // for every upload, corrupting the install layout.
      const families = [...new Set(files.map(f => sanitizeFamily(familyFromFilename(f.name))))];
      if (families.length !== 1) {
        status.className = 'status-err';
        status.style.display = 'block';
        status.textContent = 'Please select files from a single font family.';
        return;
      }
      const family = families[0];

      status.className = '';
      status.style.display = 'block';

      let uploaded = 0;
      for (const file of files) {
        status.textContent = 'Uploading ' + (uploaded + 1) + '/' + files.length + ': ' + file.name;
        const formData = new FormData();
        formData.append('family', family);
        formData.append('file', file, file.name);
        try {
          const res = await fetch('/api/fonts/upload', { method: 'POST', body: formData });
          const data = await res.json();
          if (!data.ok) {
            status.className = 'status-err';
            status.textContent = 'Failed on ' + file.name + ': ' + (data.error || 'unknown error');
            await loadFonts();
            return;
          }
        } catch (err) {
          status.className = 'status-err';
          status.textContent = 'Upload error on ' + file.name + ': ' + err.message;
          await loadFonts();
          return;
        }
        uploaded++;
      }

      status.className = 'status-ok';
      status.textContent = 'Uploaded ' + uploaded + ' file' + (uploaded === 1 ? '' : 's') +
        ' to family "' + family + '".';
      await loadFonts();
    });

    loadFonts();
  </script>
  </body>
</html>

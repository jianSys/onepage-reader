name: Rebuild WASM simulator

# The browser simulator (web/public/simulator/*.wasm) is a precompiled snapshot
# of the firmware — it can only change when someone re-runs build_wasm.sh. This
# job does that automatically: on any firmware-source change it recompiles the
# simulator with Emscripten and commits the fresh artifacts back into the web
# site, so the deployed browser build always tracks the latest firmware without a
# local emsdk install.
#
# Path filter is limited to firmware sources on purpose: the commit step only
# touches web/public/simulator/, which is NOT below these paths, so the push
# cannot re-trigger this workflow. The commit message also carries [skip ci].
on:
  push:
    branches: [main]
    paths:
      - "firmware/src/**"
      - "firmware/lib/**"
      - "firmware/boards/**"
      - "firmware/simulator/**"
      - "firmware/partitions.csv"
      - ".github/workflows/simulator-wasm.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simulator-wasm
  cancel-in-progress: true

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake python3

      - name: Build WASM simulator
        run: bash firmware/simulator/build_wasm.sh

      - name: Copy artifacts into the web site
        run: |
          cp -f firmware/simulator/build_wasm/crosspoint_simulator_wasm.js   web/public/simulator/
          cp -f firmware/simulator/build_wasm/crosspoint_simulator_wasm.wasm web/public/simulator/
          cp -f firmware/simulator/build_wasm/crosspoint_simulator_wasm.data web/public/simulator/

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/simulator/crosspoint_simulator_wasm.js \
                  web/public/simulator/crosspoint_simulator_wasm.wasm \
                  web/public/simulator/crosspoint_simulator_wasm.data
          if git diff --staged --quiet; then
            echo "No artifact changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore(sim): rebuild WASM simulator [skip ci]" \
            -m "Auto-generated by .github/workflows/simulator-wasm.yml from firmware@${GITHUB_SHA:0:7}."
          git push
